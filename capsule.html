<style>
  #replication-linked-tags { --rt-bg:#ffffff; --rt-fg:#101218; --rt-secondary:#656b76; --rt-muted:#f2f3f5; --rt-border:#e1e3e8; --rt-blue:#00b9f2; --rt-blue-bg:#e2f6ff; --rt-action:#11141a; --rt-on-action:#ffffff; --rt-shadow:#0000000c; color-scheme:light; }
  #replication-linked-tags .rt-stage { padding:20px 8px 28px; }
  #replication-linked-tags .rt-phone { box-sizing:border-box; width:min(100%,402px); margin:0 auto; padding:0 12px 14px; border:1px solid var(--rt-border); border-radius:34px; background:var(--rt-bg); color:var(--rt-fg); box-shadow:0 12px 40px var(--rt-shadow); font:400 15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; }
  #replication-linked-tags .rt-phone *, #replication-linked-tags .rt-review * { box-sizing:border-box; }
  #replication-linked-tags .rt-title { position:relative; text-align:center; padding:9px 0 10px; font-size:18px; font-weight:500; }
  #replication-linked-tags .rt-reference { display:flex; flex-direction:column; align-items:center; margin-bottom:8px; }
  #replication-linked-tags .rt-reference img { width:108px; height:144px; object-fit:cover; border-radius:15px; }
  #replication-linked-tags .rt-selection { display:flex; align-items:center; gap:6px; margin:0 3px 12px; }
  #replication-linked-tags .rt-label { flex:none; margin:0; color:var(--rt-secondary); font-size:12px; font-weight:500; white-space:nowrap; }
  #replication-linked-tags .rt-choices { display:flex; flex:1; min-width:0; gap:7px; }
  #replication-linked-tags .rt-choice { flex:1; min-width:0; min-height:30px; padding:5px 0; border:0; border-radius:20px; color:var(--rt-secondary); background:var(--rt-muted); font:inherit; font-size:14px; white-space:nowrap; }
  #replication-linked-tags .rt-choice[aria-pressed="true"] { color:var(--rt-blue); background:var(--rt-blue-bg); }
  #replication-linked-tags .rt-composer { padding:13px; border:1px solid var(--rt-border); border-radius:23px; box-shadow:0 6px 18px var(--rt-shadow); }
  #replication-linked-tags .rt-assets { display:flex; flex-wrap:wrap; gap:9px; align-items:center; margin-bottom:13px; }
  #replication-linked-tags .rt-upload { display:flex; justify-content:center; align-items:center; width:56px; min-height:56px; padding:6px 4px; border:0; border-radius:11px; background:var(--rt-muted); color:var(--rt-secondary); font:inherit; }
  #replication-linked-tags .rt-plus { font-size:24px; line-height:1; }
  #replication-linked-tags .rt-photo { position:relative; width:56px; height:56px; }
  #replication-linked-tags .rt-photo img { width:56px; height:56px; object-fit:cover; border-radius:10px; }
  #replication-linked-tags .rt-remove { position:absolute; top:-5px; right:-5px; width:24px; height:24px; padding:0; border:1px solid var(--rt-border); border-radius:50%; background:var(--rt-bg); color:var(--rt-fg); font:inherit; }
  #replication-linked-tags .rt-editor-label { position:absolute; width:1px; height:1px; margin:-1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
  #replication-linked-tags .rt-editor { min-height:128px; padding:0; border-radius:5px; outline-offset:3px; color:var(--rt-fg); background:var(--rt-bg); font:inherit; font-size:16px; line-height:1.65; white-space:pre-wrap; overflow-wrap:anywhere; }
  #replication-linked-tags .rt-token { display:inline; color:var(--rt-blue); font:inherit; }
  #replication-linked-tags .rt-tools { display:flex; align-items:center; gap:5px; margin-top:12px; }
  #replication-linked-tags .rt-pill { padding:6px 9px; border-radius:16px; background:var(--rt-muted); color:var(--rt-secondary); font-size:11px; white-space:nowrap; }
  #replication-linked-tags .rt-model { flex:1; min-width:0; white-space:normal; text-align:center; }
  #replication-linked-tags .rt-send { display:flex; align-items:center; justify-content:center; margin-left:auto; width:38px; height:38px; padding:0; border:0; border-radius:50%; background:var(--rt-action); color:var(--rt-on-action); font:inherit; font-size:25px; }
  #replication-linked-tags .rt-message { padding:10px 6px 0; color:var(--rt-secondary); font-size:12px; }
  #replication-linked-tags .rt-message:empty { display:none; }
  #replication-linked-tags .rt-review { width:min(92%,420px); max-height:85%; padding:19px; border:1px solid var(--rt-border); border-radius:20px; color:var(--rt-fg); background:var(--rt-bg); font:400 14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; }
  #replication-linked-tags .rt-review::backdrop { background:#00000055; }
  #replication-linked-tags .rt-review-head { display:flex; align-items:center; justify-content:space-between; gap:12px; font-weight:500; }
  #replication-linked-tags .rt-close { width:32px; height:32px; border:0; border-radius:50%; background:var(--rt-muted); color:var(--rt-fg); font:inherit; }
  #replication-linked-tags .rt-review pre { margin:17px 0 13px; white-space:pre-wrap; overflow-wrap:anywhere; font:inherit; }
  #replication-linked-tags .rt-demo-note { color:var(--rt-secondary); font-size:12px; }
  @media(max-width:360px) { #replication-linked-tags .rt-stage { padding:8px 0 20px; } #replication-linked-tags .rt-phone { padding:0 9px 12px; border-radius:27px; } #replication-linked-tags .rt-composer { padding:10px; } #replication-linked-tags .rt-choice { font-size:12px; } #replication-linked-tags .rt-pill { padding:6px 7px; } }

html { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; color-scheme:light; -webkit-text-size-adjust:100%; }
body { margin:0; background:#f5f6f8; overflow-x:hidden; }
.demo-notice { margin:0; padding:4px 0; text-align:center; color:#68707d; font-size:10px; line-height:14px; }
#replication-linked-tags { --rt-scale:1; width:calc(400px * var(--rt-scale)); margin:0 auto; }
#replication-linked-tags .rt-stage { position:relative; width:calc(400px * var(--rt-scale)); height:calc(850px * var(--rt-scale)); padding:0; }
#replication-linked-tags .rt-phone { position:absolute; inset:0 auto auto 0; display:flex; flex-direction:column; width:400px; max-width:none; height:850px; padding:0; border:0; border-radius:0; box-shadow:none; overflow:hidden; transform:scale(var(--rt-scale)); transform-origin:top left; }
#replication-linked-tags .rt-content { flex:1; min-height:0; padding:0 14px 12px; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; }
#replication-linked-tags .rt-title { padding:4px 0 8px; }
#replication-linked-tags .rt-reference img { width:90px; height:120px; }
#replication-linked-tags .rt-selection { flex-wrap:nowrap; gap:6px; margin:0 3px 10px; }
#replication-linked-tags .rt-label { width:auto; }
#replication-linked-tags .rt-choices { flex-basis:auto; }
#replication-linked-tags .rt-choice { min-height:44px; font-size:14px; touch-action:manipulation; }
#replication-linked-tags .rt-composer { padding:12px; }
#replication-linked-tags .rt-assets { margin-bottom:10px; }
#replication-linked-tags .rt-tools { margin-top:10px; }
#replication-linked-tags .rt-pill { padding:6px 9px; }
#replication-linked-tags .rt-send { flex:none; width:44px; height:44px; touch-action:manipulation; }
#replication-linked-tags .rt-remove, #replication-linked-tags .rt-close { width:44px; height:44px; touch-action:manipulation; }
#replication-linked-tags .rt-remove { width:24px; height:24px; }
#replication-linked-tags .rt-remove::after { content:""; position:absolute; inset:-8px; }
#replication-linked-tags .rt-review { max-height:80dvh; }
#replication-linked-tags .rt-editor { min-height:104px; font-size:16px; line-height:1.6; }
#replication-linked-tags .rt-keyboard { display:block; flex:none; width:400px; height:auto; user-select:none; pointer-events:none; }
#replication-linked-tags.rt-native-keyboard-open .rt-keyboard { visibility:hidden; }
#replication-linked-tags button { cursor:pointer; }
@media(min-width:600px) {
  body { padding:16px 0; }
  #replication-linked-tags .rt-phone { border-radius:24px; box-shadow:0 10px 32px var(--rt-shadow); }
}


#replication-linked-tags .rt-reference { margin:8px 0 18px; }
#replication-linked-tags .rt-reference img { width:120px; height:160px; }
#replication-linked-tags .rt-editor { min-height:110px; }
#replication-linked-tags .rt-tools { gap:6px; }
#replication-linked-tags .rt-pill { flex:none; padding:7px 10px; font-size:12px; }
#replication-linked-tags .rt-replace { display:flex; align-items:center; gap:4px; border:0; min-height:36px; font-family:inherit; }
#replication-linked-tags .rt-replace[aria-expanded="true"] { background:#e7e9ed; }
#replication-linked-tags .rt-replace-label { white-space:nowrap; }
#replication-linked-tags .rt-chevron { color:#969ca7; }
#replication-linked-tags .rt-model { flex:1; padding:7px 5px; }
#replication-linked-tags .rt-object-menu { position:fixed; z-index:20; width:176px; padding:6px; border:1px solid #f0f0f2; border-radius:16px; background:white; box-shadow:0 10px 40px #00000020; font:500 16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; color:#101218; }
#replication-linked-tags .rt-object-menu[hidden] { display:none; }
#replication-linked-tags .rt-object-option { display:flex; align-items:center; justify-content:space-between; width:100%; height:44px; border:0; border-radius:9px; padding:0 10px; background:white; color:inherit; font:inherit; text-align:left; touch-action:manipulation; }
#replication-linked-tags .rt-object-option:hover { background:#f5f6f8; }
#replication-linked-tags .rt-object-option::after { content:"✓"; visibility:hidden; font-size:20px; }
#replication-linked-tags .rt-object-option[aria-pressed="true"]::after { visibility:visible; }
#replication-linked-tags .rt-replace:focus-visible, #replication-linked-tags .rt-object-option:focus-visible { outline:2px solid #00b9f2; outline-offset:2px; }

  function tag(key) {
    const token = document.createElement('span');
    token.className = 'rt-token'; token.dataset.category = key;
    token.contentEditable = 'false'; token.textContent = '替换' + key + '：';
    return token;
  }
  function active() { return [...editor.querySelectorAll('.rt-token')].map(token => token.dataset.category).filter(key => categories.includes(key)); }
  function sync() {
    selected = active();
    const labels = selected.slice(0, 2).join('、');
    trigger.querySelector('.rt-replace-label').textContent = selected.length ? '替换' + labels + (selected.length > 2 ? '…' : '') : '替换对象';
    trigger.setAttribute('aria-label', selected.length ? '替换' + selected.join('、') + '，点击修改，可多选' : '替换对象，点击选择，可多选');
    menu.querySelectorAll('button').forEach(button => button.setAttribute('aria-pressed', String(selected.includes(button.dataset.category))));
    if (!menu.hidden) positionMenu();
  }
  function rememberRange() {
    const selection = window.getSelection();
    if (selection?.rangeCount && editor.contains(selection.anchorNode) && editor.contains(selection.focusNode)) savedRange = selection.getRangeAt(0).cloneRange();
  }
  function placeRange(range) {
    editor.focus();
    const selection = window.getSelection();
    selection.removeAllRanges(); selection.addRange(range);
    savedRange = range.cloneRange();
  }
  function insertionRange() {
    const range = savedRange && editor.contains(savedRange.commonAncestorContainer) ? savedRange.cloneRange() : document.createRange();
    if (!savedRange || !editor.contains(range.commonAncestorContainer)) { range.selectNodeContents(editor); range.collapse(false); }
    else range.collapse(false);
    let node = range.startContainer.nodeType === Node.ELEMENT_NODE ? range.startContainer : range.startContainer.parentElement;
    const token = node?.closest('.rt-token');
    if (token) range.setStartAfter(token);
    range.collapse(true);
    return range;
  }
  function segments() {
    const parts = [];
    function text(value) {
      if (!value) return;
      if (parts[parts.length - 1]?.type === 'text') parts[parts.length - 1].value += value;
      else parts.push({ type:'text', value });
    }
    function newline() { if (parts.length && !parts[parts.length - 1].value?.endsWith('\n')) text('\n'); }
    function walk(node) {
      if (node.nodeType === Node.TEXT_NODE) { text(node.textContent.replace(/\u00a0/g, ' ')); return; }
      if (node.nodeType !== Node.ELEMENT_NODE) return;
      if (node.matches('.rt-token') && categories.includes(node.dataset.category)) { parts.push({ type:'tag', key:node.dataset.category }); return; }
      if (node.tagName === 'BR') { text('\n'); return; }
      const block = ['DIV', 'P', 'LI'].includes(node.tagName);
      if (block && node !== editor && node.previousSibling) newline();
      node.childNodes.forEach(walk);
      if (block && node !== editor && node.nextSibling) newline();
    }
    editor.childNodes.forEach(walk);
    return parts;
  }
  function persist() {
    if (composing) return;
    try { localStorage.setItem(storageKey, JSON.stringify({version:2, segments:segments()})); } catch (_) {}
  }
  function changed() { sync(); rememberRange(); persist(); }
  function toggle(key) {
    const existing = [...editor.querySelectorAll('.rt-token')].find(token => token.dataset.category === key);
    if (existing) {
      const range = document.createRange(); range.selectNode(existing); placeRange(range);
      try { document.execCommand('delete'); } catch (_) {}
      if (editor.contains(existing)) existing.remove();
      message.textContent = '';
    } else {
      const range = insertionRange(); placeRange(range);
      const prefix = document.createRange(); prefix.selectNodeContents(editor); prefix.setEnd(range.startContainer, range.startOffset);
      const startNewLine = prefix.toString().length > 0 && !prefix.toString().endsWith('\n');
      // Fixed category labels only; pasted user content never enters HTML.
      const html = (startNewLine ? '<br>' : '') + tag(key).outerHTML + '&nbsp;';
      let inserted = false;
      try { inserted = document.execCommand('insertHTML', false, html); } catch (_) {}
      if (!inserted || !active().includes(key)) {
        const fragment = document.createDocumentFragment();
        if (startNewLine) fragment.appendChild(document.createElement('br'));
        fragment.appendChild(tag(key));
        const space = document.createTextNode(' '); fragment.appendChild(space); range.insertNode(fragment);
        range.setStart(space, 1); range.collapse(true); placeRange(range);
      }
      message.textContent = '';
    }
    changed();
  }
  function positionMenu() {
    const scale = Math.min(1, document.documentElement.clientWidth / 400);
    menu.style.width = 176 * scale + 'px';
    menu.style.fontSize = 16 * scale + 'px';
    const rect = trigger.getBoundingClientRect();
    const width = menu.getBoundingClientRect().width;
    menu.style.left = Math.max(8, Math.min(window.innerWidth - width - 8, rect.left + rect.width / 2 - width / 2)) + 'px';
    menu.style.top = Math.max(8, rect.top - menu.offsetHeight - 10) + 'px';
  }
  function closeMenu(restoreFocus = false) {
    menu.hidden = true;
    trigger.setAttribute('aria-expanded', 'false');
    if (restoreFocus) trigger.focus({preventScroll:true});
  }
  trigger.addEventListener('click', () => {
    menu.hidden = !menu.hidden;
    trigger.setAttribute('aria-expanded', String(!menu.hidden));
    if (!menu.hidden) positionMenu();
  });
  categories.forEach(key => {
    const button = document.createElement('button');
    button.type = 'button'; button.className = 'rt-object-option'; button.dataset.category = key;
    button.textContent = '替换' + key; button.setAttribute('aria-label', '替换' + key); button.setAttribute('aria-pressed', 'false');
    button.addEventListener('mousedown', event => event.preventDefault());
    button.addEventListener('click', () => {
      toggle(key);
    });
    menu.appendChild(button);
  });
  document.addEventListener('pointerdown', event => {
    if (!menu.hidden && !menu.contains(event.target) && !trigger.contains(event.target)) closeMenu();
  });
  document.addEventListener('keydown', event => {
    if (menu.hidden) return;
    const buttons = [...menu.querySelectorAll('button')];
    const index = buttons.indexOf(document.activeElement);
    if (event.key === 'Escape') { event.preventDefault(); closeMenu(true); }
    if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
      event.preventDefault();
      buttons[(index + (event.key === 'ArrowDown' ? 1 : -1) + buttons.length) % buttons.length].focus({preventScroll:true});
    }
  });
  root.querySelector('.rt-content').addEventListener('scroll', () => { if (!menu.hidden) positionMenu(); });
  function fitDemo() {
    const width = document.documentElement.clientWidth;
    root.style.setProperty('--rt-scale', String(Math.min(1, width / 400)));
    const visibleHeight = window.visualViewport?.height || window.innerHeight;
    const focused = document.activeElement === editor;
    if (!focused || width !== viewportWidth) { viewportHeight = Math.max(window.innerHeight, visibleHeight); viewportWidth = width; }
    root.classList.toggle('rt-native-keyboard-open', focused && viewportHeight - visibleHeight > 120);
    if (!menu.hidden) positionMenu();
  }
  window.addEventListener('resize', fitDemo);
  window.visualViewport?.addEventListener('resize', fitDemo);
  editor.addEventListener('focus', fitDemo);
  editor.addEventListener('blur', fitDemo);
  document.addEventListener('selectionchange', rememberRange);
  editor.addEventListener('input', () => { if (!composing) changed(); });
  editor.addEventListener('compositionstart', () => { composing = true; });
  editor.addEventListener('compositionend', () => { composing = false; changed(); });
  editor.addEventListener('paste', event => {
    event.preventDefault();
    const value = event.clipboardData?.getData('text/plain') || '';
    if (!value) return;
    let inserted = false;
    try { inserted = document.execCommand('insertText', false, value); } catch (_) {}
    if (!inserted) {
      const selection = window.getSelection();
      if (!selection?.rangeCount) return;
      const range = selection.getRangeAt(0); range.deleteContents();
      const text = document.createTextNode(value); range.insertNode(text); range.setStartAfter(text); range.collapse(true); placeRange(range);
    }
    changed();
  });
  editor.addEventListener('drop', event => event.preventDefault());

  function renderPhotos() {
    const assets = root.querySelector('.rt-assets'); assets.querySelectorAll('.rt-photo').forEach(tile => tile.remove());
    images.forEach(image => {
      const tile = document.createElement('div'); tile.className = 'rt-photo';
      const photo = document.createElement('img'); photo.src = image.url; photo.alt = image.name;
      const remove = document.createElement('button'); remove.type = 'button'; remove.className = 'rt-remove'; remove.textContent = '×'; remove.setAttribute('aria-label', '删除参考图 ' + image.name);
      remove.addEventListener('click', () => { images = images.filter(item => item.id !== image.id); renderPhotos(); message.textContent = '已移除这张参考图。'; });
      tile.append(photo, remove); assets.insertBefore(tile, assets.querySelector('.rt-upload'));
    });
  }
  root.querySelector('.rt-upload').addEventListener('click', () => { picker.value = ''; picker.click(); });
  picker.addEventListener('change', async () => {
    for (const file of [...picker.files]) {
      if (!['image/png','image/jpeg','image/webp','image/gif','image/avif'].includes(file.type) || file.size > 5 * 1024 * 1024) { message.textContent = '请选择不超过 5 MB 的图片。'; continue; }
      try {
        const url = await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = () => reject(reader.error); reader.readAsDataURL(file); });
        images.push({ id:Date.now().toString(36) + Math.random().toString(36).slice(2), name:file.name, url }); message.textContent = '已添加参考图。';
      } catch (_) { message.textContent = '这张图片未能读取，请重新选择。'; }
    }
    renderPhotos();
  });

  root.querySelector('.rt-send').addEventListener('click', () => {
    closeMenu();
    const prompt = segments().map(part => part.type === 'tag' ? '替换' + part.key + '：' : part.value).join('').trim();
    review.querySelector('pre').textContent = (prompt || '（没有填写文字要求）') + '\n\n替换对象：' + (selected.length ? selected.join('、') : '未选择') + '\n\n' + (images.length ? '参考图：\n' + images.map(image => image.name).join('\n') : '参考图：未添加');
    review.showModal();
  });
  review.querySelector('.rt-close').addEventListener('click', () => review.close());
  review.addEventListener('click', event => { if (event.target === review) { const box = review.getBoundingClientRect(); if (event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom) review.close(); } });
  function restore(saved) {
    if (!saved) return;
    const parts = saved.version === 2 && Array.isArray(saved.segments) ? saved.segments :
      typeof saved.prompt === 'string' ? [{type:'text', value:saved.prompt}, ...(Array.isArray(saved.selected) ? saved.selected.filter(key => categories.includes(key)).flatMap(key => [{type:'text', value:'\n'}, {type:'tag', key}]) : [])] : null;
    if (!parts) return;
    const fragment = document.createDocumentFragment();
    const seen = new Set();
    for (const part of parts.slice(0, 100)) {
      if (part?.type === 'text' && typeof part.value === 'string') fragment.appendChild(document.createTextNode(part.value));
      else if (part?.type === 'tag' && categories.includes(part.key) && !seen.has(part.key)) { fragment.appendChild(tag(part.key)); seen.add(part.key); }
    }
    editor.replaceChildren(fragment); savedRange = null;
  }
  try { restore(JSON.parse(localStorage.getItem(storageKey))); } catch (_) {}
  renderPhotos(); sync(); fitDemo();
})();
</script>

</body>
</html>
